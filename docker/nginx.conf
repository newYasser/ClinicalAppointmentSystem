server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular client calls '/api' relative (see src/environments/environment.ts),
    # so proxying it here puts the API on the same origin as the app. That is also why
    # the Cors policy never comes into play in this setup — there is no cross origin.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location /openapi/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

 
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
